# 每次推送到 main 和每个 Pull Request：校验插件市场与插件清单，并运行测试。
# 校验和测试不需要登录 Claude，也不调用模型。
name: 检查 / Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Claude Code 命令行 / Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: 版本 / Version
        run: claude --version

      - name: 校验插件市场 / Validate the marketplace
        run: claude plugin validate .

      - name: 校验插件 / Validate the plugin
        run: claude plugin validate usage-band

      - name: 运行测试 / Run the tests
        run: claude plugin test usage-band
